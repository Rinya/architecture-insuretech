# GraphQL Schema для сервиса управления клиентскими данными (client-info)
# Спроектирована для замены множественных REST вызовов на гибкие GraphQL запросы

"""
Основная сущность клиента с возможностью загрузки связанных данных
"""
type Client {
  """Уникальный идентификатор клиента"""
  id: ID!

  """Имя клиента"""
  name: String!

  """Возраст клиента"""
  age: Int!

  """Список документов клиента. Загружается по требованию."""
  documents: [Document!]!

  """Список родственников клиента. Загружается по требованию."""
  relatives: [Relative!]!
}

"""
Документ клиента (паспорт, водительские права, полис и т.д.)
"""
type Document {
  """Уникальный идентификатор документа"""
  id: ID!

  """Тип документа (паспорт, водительское удостоверение, полис и т.д.)"""
  type: String!

  """Номер документа"""
  number: String!

  """Дата выдачи документа"""
  issueDate: String!

  """Дата окончания срока действия документа"""
  expiryDate: String!
}

"""
Родственник клиента для страховых программ
"""
type Relative {
  """Уникальный идентификатор родственника"""
  id: ID!

  """Тип родственной связи (супруг, ребенок, родитель и т.д.)"""
  relationType: String!

  """Имя родственника"""
  name: String!

  """Возраст родственника"""
  age: Int!
}

"""
Корневые запросы для получения данных
"""
type Query {
  """
  Получить информацию о клиенте по ID.
  Эквивалент REST: GET /clients/{id}

  Преимущества GraphQL:
  - Возможность запросить только нужные поля
  - Возможность включить связанные данные в один запрос
  """
  client(id: ID!): Client

  """
  Получить список всех клиентов (для административных задач)
  """
  clients: [Client!]!

  """
  Получить документы клиента по ID.
  Эквивалент REST: GET /clients/{id}/documents

  Преимущества GraphQL:
  - Возможность запросить только нужные поля документов
  - Можно комбинировать с информацией о клиенте
  """
  clientDocuments(clientId: ID!): [Document!]!

  """
  Получить родственников клиента по ID.
  Эквивалент REST: GET /clients/{id}/relatives

  Преимущества GraphQL:
  - Возможность запросить только нужные поля родственников
  - Можно комбинировать с информацией о клиенте
  """
  clientRelatives(clientId: ID!): [Relative!]!
}

"""
Мутации для изменения данных (расширение функциональности)
"""
type Mutation {
  """Обновить информацию о клиенте"""
  updateClient(id: ID!, input: ClientInput!): Client

  """Добавить новый документ клиенту"""
  addDocument(clientId: ID!, input: DocumentInput!): Document

  """Добавить нового родственника клиенту"""
  addRelative(clientId: ID!, input: RelativeInput!): Relative
}

"""
Входные данные для обновления клиента
"""
input ClientInput {
  name: String
  age: Int
}

"""
Входные данные для создания документа
"""
input DocumentInput {
  type: String!
  number: String!
  issueDate: String!
  expiryDate: String!
}

"""
Входные данные для создания родственника
"""
input RelativeInput {
  relationType: String!
  name: String!
  age: Int!
}

"""
Схема GraphQL с корневыми типами
"""
schema {
  query: Query
  mutation: Mutation
}